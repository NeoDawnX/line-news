name: daily

on:
  schedule:
    # 06:40 JST（UTC 21:40 前日）。Actions の cron は数分〜数十分遅れることがある
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      skip_broadcast:
        description: "LINE に送らない（生成と公開だけ）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - name: collect
        timeout-minutes: 11
        run: npm run collect

      - name: generate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        timeout-minutes: 15
        run: npm run generate

      # verify が落ちたら以降は走らない（配信されない）。content/ は commit されるので中身は確認できる
      - name: verify
        timeout-minutes: 2
        run: npm run verify

      - name: publish
        timeout-minutes: 2
        run: npm run publish

      - name: commit content, docs, seen
        if: always()
        run: |
          git config user.name "doctornews-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content docs seen.json
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Tokyo date +%F)"
          git push

      - name: broadcast
        if: ${{ !inputs.skip_broadcast }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        timeout-minutes: 2
        run: npm run broadcast
